<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141726"/>
      <stop offset="1" stop-color="#221a3a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="0.55" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#b14bff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9ff"/>
      <stop offset="1" stop-color="#5a8bff"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Disc -->
  <g transform="translate(470 470)">
    <circle r="300" fill="url(#disc)"/>
    <circle r="300" fill="url(#sheen)"/>
    <circle r="300" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
    <!-- data rings -->
    <circle r="232" fill="none" stroke="#0b0d18" stroke-opacity="0.35" stroke-width="10"/>
    <circle r="180" fill="none" stroke="#0b0d18" stroke-opacity="0.30" stroke-width="10"/>
    <circle r="128" fill="none" stroke="#0b0d18" stroke-opacity="0.25" stroke-width="10"/>
    <!-- hub -->
    <circle r="74" fill="#141726"/>
    <circle r="30" fill="#0b0d18" stroke="#4aa3ff" stroke-width="6"/>
  </g>

  <!-- Magnifier exploring the disc -->
  <g transform="translate(645 645)">
    <circle r="150" fill="#0b0d18" fill-opacity="0.55"/>
    <circle r="150" fill="none" stroke="url(#glass)" stroke-width="30"/>
    <circle r="150" fill="url(#glass)" fill-opacity="0.12"/>
    <rect x="96" y="96" width="230" height="64" rx="32" transform="rotate(45 96 96)" fill="url(#glass)"/>
  </g>
</svg>
